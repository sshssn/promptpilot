<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Skippy+ Options</title>
    <style>
        :root {
            --primary: #00ff88;
            --primary-dim: #00ff8820;
            --secondary: #bd00ff;
            --bg: #050505;
            --surface: #111111;
            --surface-hover: #1a1a1a;
            --text: #ffffff;
            --text-dim: #888888;
            --border: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .badge {
            background: var(--primary);
            color: #000;
            font-weight: 800;
            font-size: 18px;
            padding: 4px 10px;
            border-radius: 6px;
            box-shadow: 0 0 15px var(--primary-dim);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 16px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dim);
            margin-bottom: 10px;
            display: block;
        }

        select,
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary-dim);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            height: 20px;
            color: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status.visible {
            opacity: 1;
        }

        /* Option/Select Styling */
        select {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="128x128.png" height="48" alt="Skippy Logo">
                <span class="badge" style="background: var(--secondary); font-size: 12px;">Beta</span>
            </div>
            <div class="subtitle">Configure your AI prowess</div>
        </div>

        <div class="card">
            <div class="input-group">
                <label class="input-label">AI Provider & Model</label>
                <select id="providerSelect">
                    <option value="gemini-2.5-flash">Google Gemini 2.5 Flash (Recommended)</option>
                    <option value="gpt-4o-mini">OpenAI GPT-4o Mini</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-..." spellcheck="false">
                <div style="font-size: 12px; color: var(--text-dim); margin-top: 8px;">
                    Your key is stored securely in your browser storage.
                </div>
            </div>

            <button class="btn" id="saveBtn">Save Configuration</button>
            <div class="status" id="statusMsg">Settings Saved Successfully!</div>
        </div>
    </div>

    <script src="options.js"></script>
</body>

</html>
