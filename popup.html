<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Skippy+</title>
  <style>
    :root {
      --primary: #00ff9d;
      --primary-dim: rgba(0, 255, 157, 0.2);
      --secondary: #bd00ff;
      --bg: #0a0a0a;
      --surface: #161616;
      --surface-hover: #222222;
      --text: #ffffff;
      --text-dim: #999999;
      --border: #333333;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container img {
      height: 42px;
      width: auto;
      filter: drop-shadow(0 0 10px rgba(0, 255, 157, 0.2));
    }

    .badge {
      background: rgba(0, 255, 157, 0.1);
      color: var(--primary);
      border: 1px solid var(--primary-dim);
      font-weight: 700;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 100px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .settings-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .settings-btn:hover {
      color: var(--text);
      border-color: var(--text-dim);
      background: var(--surface-hover);
    }

    /* Tabs */
    .tabs {
      display: flex;
      padding: 6px;
      background: var(--surface);
      margin: 20px 24px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--surface-hover);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Content Area */
    .content {
      padding: 0 24px 24px;
      min-height: 300px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Cards */
    .card {
      background: linear-gradient(180deg, var(--surface) 0%, rgba(20, 20, 20, 0.5) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      color: var(--text-dim);
    }

    .stat-value {
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
    }

    #statusText {
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-dim);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 25px var(--primary-dim);
    }

    .btn-primary:hover {
      background: #33ffab;
      box-shadow: 0 0 35px var(--primary-dim);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--text-dim);
    }

    .btn-magic {
      background: linear-gradient(135deg, var(--secondary), #8000ff);
      color: white;
      box-shadow: 0 0 25px rgba(189, 0, 255, 0.3);
    }

    .btn-magic:hover {
      box-shadow: 0 0 35px rgba(189, 0, 255, 0.5);
    }

    /* Answer Box */
    .answer-box {
      margin-top: 16px;
      padding: 16px;
      background: rgba(0, 255, 157, 0.05);
      border: 1px solid var(--primary-dim);
      border-radius: 12px;
      color: var(--primary);
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
    }

    .loading {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      padding: 24px;
      display: none;
    }

    /* Settings Panel Animation */
    .settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .settings-panel.open {
      transform: translateX(0);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-container">
      <img src="128x128.png" alt="Skippy">
      <span class="badge">Beta</span>
    </div>
    <button class="settings-btn" id="openSettings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path
          d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
        </path>
      </svg>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-target="skipper">Video Skipper</div>
    <div class="tab" data-target="solver">AI Solver</div>
  </div>

  <!-- Main Content -->
  <div class="content">

    <!-- Skipper Section -->
    <div id="skipper" class="section active">
      <div class="card">
        <div class="stat-row">
          <span class="stat-label">Videos Found</span>
          <span class="stat-value" id="videoCount">0</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Status</span>
          <span class="stat-value" id="statusText">Ready</span>
        </div>
      </div>

      <button class="btn btn-primary" id="skipBtn">
        ⏭️ Skip Video
      </button>

      <div style="margin-top: 12px;">
        <button class="btn btn-secondary" id="autoSkipToggle">
          🔄 Auto-Skip: OFF
        </button>
      </div>
    </div>

    <!-- Solver Section -->
    <div id="solver" class="section">
      <div class="card" style="text-align: center; padding: 24px;">
        <div style="font-size: 48px; margin-bottom: 12px;">🧠</div>
        <div style="color: var(--text-dim); font-size: 13px;">
          Capture screen and get instant answers powered by AI.
        </div>
      </div>

      <button class="btn btn-magic" id="solveBtn">
        ✨ Snap & Solve
      </button>

      <div class="loading" id="solverLoading">
        Thinking...
      </div>

      <div class="answer-box" id="answerResult"></div>
    </div>
  </div>

  <!-- Settings Panel REMOVED - using Options Page -->

  <script src="popup.js" type="module"></script>
</body>

</html>
